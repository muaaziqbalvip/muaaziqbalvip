      <stop offset="1" stop-color="#3EE0A2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#BFE9D6" stroke-opacity="0.045"/>
    </pattern>
    <style>
      .spin { transform-origin: 232px 224px; animation: spin 60s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pill { animation: breathe 6s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="392" rx="24" fill="url(#bg)"/>
