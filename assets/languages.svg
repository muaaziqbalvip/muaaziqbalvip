<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" role="img" aria-labelledby="lTitle lDesc">
  <title id="lTitle">Code written by Muaaz Iqbal, by language</title>
  <desc id="lDesc">Share of code across 92 public repositories: JavaScript, HTML, Python, Kotlin, CSS, TypeScript and a little shell and Java.</desc>
  <defs>
