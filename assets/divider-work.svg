<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="46" viewBox="0 0 1200 46" role="img" aria-labelledby="t">
  <title id="t">Section divider 01</title>
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64E7B0" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#64E7B0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#64E7B0" stop-opacity="0.04"/>
    </linearGradient>
    <style>
      .glow { animation: glow 5s ease-in-out infinite; transform-origin: 24px 23px; }
      @keyframes glow { 0%,100% { opacity: .45; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.08); } }
      .run { animation: run 6s linear infinite; }
      @keyframes run { 0% { transform: translateX(0); } 100% { transform: translateX(1080px); } }
    </style>
  </defs>
  <text x="0" y="29" fill="#64E7B0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="2">01</text>
  <g>
    <rect x="20" y="16" width="14" height="14" rx="3" transform="rotate(45 27 23)" fill="#64E7B0" fill-opacity="0.25" stroke="#64E7B0" stroke-opacity="0.75"/>
    <circle cx="27" cy="23" r="2.2" fill="#64E7B0">
      <animate attributeName="r" values="1.4;2.6;1.4" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <line x1="46" y1="23" x2="560" y2="23" stroke="url(#ln)" stroke-width="1.3"/>
  <line x1="46" y1="23" x2="170" y2="23" stroke="#64E7B0" stroke-width="1.6" stroke-opacity="0.9"/>
  <circle r="2.6" cy="23" fill="#64E7B0" opacity="0.55">
    <animate attributeName="cx" values="120;1140" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.75;0" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>