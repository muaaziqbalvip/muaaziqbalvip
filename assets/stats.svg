<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="sTitle sDesc">
  <title id="sTitle">Muaaz Iqbal in numbers</title>
  <desc id="sDesc">92 public repositories, over 11,000 products in Mizanora, 800 live channels and 38 free tools.</desc>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#BFE9D6" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#3EE0A2" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3EE0A2" stop-opacity="0"/>
    </radialGradient>
    <style>
      .n1,.n2,.n3,.n4 { animation: rise 6s ease-in-out infinite; }
      .n2 { animation-delay: .5s; } .n3 { animation-delay: 1s; } .n4 { animation-delay: 1.5s; }
      @keyframes rise { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="200" rx="24" fill="#07120E"/>
  <rect width="1200" height="200" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="200" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="198" rx="23" fill="none" stroke="#64E7B0" stroke-opacity="0.12"/>
  <text x="68" y="36" fill="#CFE6DB" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2.6">BY THE NUMBERS · OCTOBER 2026</text>
  <text x="1132" y="36" text-anchor="end" fill="#5F7C71" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.6">BUILT ALONE, TESTED ON A CHEAP PHONE</text>
