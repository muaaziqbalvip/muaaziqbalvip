<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="qTitle qDesc">
  <title id="qTitle">Muaaz Iqbal — working philosophy</title>
  <desc id="qDesc">Unchi soch, chhote qadam: think in years, act in days, and build for your own people first.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B15"/>
      <stop offset="0.55" stop-color="#0B241C"/>
      <stop offset="1" stop-color="#123026"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#F1C86A" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#F1C86A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1C86A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F1C86A" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F1C86A" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sh { animation: shine 7s ease-in-out infinite; }
      @keyframes shine { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      .arc { transform-origin: 600px 300px; animation: breathe 9s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .6; transform: scale(1.04); } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="26" fill="url(#spot)"/>
  <g class="arc" fill="none" stroke="#F1C86A" stroke-opacity="0.35">
    <circle cx="600" cy="300" r="268"/>
    <circle cx="600" cy="300" r="208" stroke-opacity="0.22"/>
    <circle cx="600" cy="300" r="148" stroke-opacity="0.14"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="25" fill="none" stroke="#64E7B0" stroke-opacity="0.12"/>
  <text x="600" y="86" text-anchor="middle" fill="#E9D39B" font-family="'Noto Naskh Arabic', 'Scheherazade New', 'Traditional Arabic', serif" font-size="34" opacity="0.92">مِيزَان</text>
  <text x="600" y="112" text-anchor="middle" fill="#6E8C81" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.6" letter-spacing="3">MĪZĀN · BALANCE, THE OLDEST FORM OF FAIRNESS</text>
  <text x="600" y="168" text-anchor="middle" fill="#F5FBF7" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.6">Unchi soch. Chhote qadam.</text>
  <line x1="480" y1="196" x2="720" y2="196" stroke="url(#qline)" stroke-width="1.2"/>
  <text x="600" y="228" text-anchor="middle" fill="#B7D2C6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.4">Think in years, act in days. Build for your own people first —</text>
  <text x="600" y="252" text-anchor="middle" fill="#B7D2C6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.4">in their language, on the phone they actually own.</text>
  <g transform="translate(600 274)">
    <circle class="sh" cx="-104" cy="0" r="2.4" fill="#64E7B0"/>
    <circle class="sh" cx="0" cy="0" r="2.4" fill="#F1C86A"/>
    <circle class="sh" cx="104" cy="0" r="2.4" fill="#64E7B0"/>
  </g>
</svg>
