<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">The working philosophy of Muaaz Iqbal</title>
  <desc id="d">Unchi soch, chhote qadam — think in years, act in days, build for your own people first.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08170F"/><stop offset="0.55" stop-color="#0B241C"/><stop offset="1" stop-color="#123026"/></linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0" r="0.9"><stop offset="0" stop-color="#F1C86A" stop-opacity="0.14"/><stop offset="1" stop-color="#F1C86A" stop-opacity="0"/></radialGradient>
    <linearGradient id="qline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F1C86A" stop-opacity="0"/><stop offset="0.5" stop-color="#F1C86A" stop-opacity="0.75"/><stop offset="1" stop-color="#F1C86A" stop-opacity="0"/></linearGradient>
    <style>
      .arc { transform-origin: 600px 330px; animation: breathe 10s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .3; transform: scale(1); } 50% { opacity: .65; transform: scale(1.03); } }
      .tick { animation: shine 6s ease-in-out infinite; }
      @keyframes shine { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="330" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="26" fill="url(#spot)"/>
  <g class="arc" fill="none" stroke="#F1C86A" stroke-opacity="0.4">
    <circle cx="600" cy="330" r="300"/><circle cx="600" cy="330" r="236" stroke-opacity="0.24"/><circle cx="600" cy="330" r="172" stroke-opacity="0.14"/>
  </g>
  <rect x="1" y="1" width="1198" height="328" rx="25" fill="none" stroke="#64E7B0" stroke-opacity="0.13"/>

  <text x="600" y="76" text-anchor="middle" fill="#E9D39B" font-family="'Noto Naskh Arabic', 'Scheherazade New', 'Traditional Arabic', serif" font-size="32" opacity="0.95">مِيزَان</text>
  <text x="600" y="100" text-anchor="middle" fill="#6E8C81" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.6" letter-spacing="3">MĪZĀN · BALANCE, THE OLDEST FORM OF FAIRNESS</text>

  <text x="600" y="158" text-anchor="middle" fill="#F6FCF8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.7">Unchi soch. Chhote qadam.</text>
  <line x1="470" y1="186" x2="730" y2="186" stroke="url(#qline)" stroke-width="1.3"/>

  <text x="600" y="220" text-anchor="middle" fill="#B7D2C6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.6">Think in years, act in days. Build for your own people first —</text>
  <text x="600" y="244" text-anchor="middle" fill="#B7D2C6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.6">in their language, on the phone they actually own.</text>

  <g transform="translate(600 276)">
    <circle class="tick" cx="-120" cy="0" r="2.6" fill="#64E7B0"/>
    <circle class="tick" cx="0" cy="0" r="2.6" fill="#F1C86A"/>
    <circle class="tick" cx="120" cy="0" r="2.6" fill="#64E7B0"/>
    <line x1="-96" y1="0" x2="-24" y2="0" stroke="#64E7B0" stroke-opacity="0.3"/>
    <line x1="24" y1="0" x2="96" y2="0" stroke="#64E7B0" stroke-opacity="0.3"/>
  </g>
  <text x="600" y="306" text-anchor="middle" fill="#6E8C81" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.4" letter-spacing="2.2">HONEST PRICES · HALAL EARNING · PRIVACY BY DEFAULT</text>
</svg>