<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Muaaz Iqbal — Full-Stack Developer, AI Orchestrator and Founder of Mizanora</title>
  <desc id="heroDesc">Light emerald and gold banner: Muaaz Iqbal, Kasur, Punjab, Pakistan. Building useful software in Urdu and English.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F3FBF7"/>
      <stop offset="1" stop-color="#E9F7F0"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.86" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#22B37A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22B37A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0.08" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#D9A63C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D9A63C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12A06B"/>
      <stop offset="0.55" stop-color="#12A06B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C08A22"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12A06B"/>
      <stop offset="0.6" stop-color="#12A06B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#12A06B" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" x1="-0.35" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.6;1.5" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.1;2.2" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#0E7A52" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#0E7A52" fill-opacity="0.13"/>
    </pattern>

    <clipPath id="nameClip">
      <text x="72" y="172" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-2.6">Muaaz Iqbal</text>
    </clipPath>

    <style>
      .ring-slow { transform-origin: 972px 208px; animation: spin 46s linear infinite; }
      .ring-fast { transform-origin: 972px 208px; animation: spin 26s linear infinite reverse; }
      .ring-mid  { transform-origin: 972px 208px; animation: pulse 7s ease-in-out infinite; }
      .dot-a { transform-origin: 972px 208px; animation: spin 14s linear infinite; }
      .dot-b { transform-origin: 972px 208px; animation: spin 21s linear infinite reverse; }
      .live  { animation: live 2.2s ease-in-out infinite; }
      .float1 { animation: floaty 9s ease-in-out infinite; }
      .float2 { animation: floaty 12s ease-in-out infinite 1.2s; }
      .float3 { animation: floaty 15s ease-in-out infinite 2.6s; }
      .fade-in { animation: fadeIn 1.4s ease-out both; }
      .fade-in-2 { animation: fadeIn 1.4s ease-out 0.25s both; }
      .draw { stroke-dasharray: 120 900; animation: draw 6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes live { 0%,100% { opacity: 1; r: 4.6; } 50% { opacity: .35; r: 3.2; } }
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { 0% { stroke-dashoffset: 900; } 55%,100% { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="26" fill="url(#glowA)"/>
  <rect width="1200" height="420" rx="26" fill="url(#glowB)"/>
  <rect x="742" width="458" height="420" fill="url(#dots)" opacity="0.8"/>
  <path d="M742 420 1200 420 1200 0Z" fill="#0E7A52" fill-opacity="0.045"/>
  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="#0E7A52" stroke-opacity="0.16"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#rule)" opacity="0.9"/>

  <circle class="float1" cx="700" cy="112" r="2.6" fill="#12A06B" opacity="0.45"/>
  <circle class="float2" cx="640" cy="330" r="2" fill="#C08A22" opacity="0.5"/>
  <circle class="float3" cx="118" cy="386" r="2.2" fill="#12A06B" opacity="0.4"/>

  <g>
    <circle cx="972" cy="208" r="150" fill="url(#glowA)"/>
    <circle cx="972" cy="208" r="150" fill="none" stroke="#12A06B" stroke-opacity="0.08"/>

    <g class="ring-slow">
      <circle cx="972" cy="208" r="128" fill="none" stroke="url(#ring)" stroke-width="1.4" stroke-opacity="0.6"
              stroke-dasharray="3 11" stroke-linecap="round"/>
    </g>

    <g class="ring-fast">
      <circle cx="972" cy="208" r="96" fill="none" stroke="url(#ring)" stroke-width="1.6" stroke-opacity="0.9"
              stroke-dasharray="190 420" stroke-linecap="round"/>
    </g>

    <circle class="ring-mid" cx="972" cy="208" r="64" fill="none" stroke="#12A06B" stroke-opacity="0.35" stroke-width="1.2"/>

    <g class="dot-a"><circle cx="1100" cy="208" r="4.6" fill="#12A06B"/></g>
    <g class="dot-b"><circle cx="972" cy="112" r="3.6" fill="#C08A22"/></g>

    <circle cx="972" cy="208" r="42" fill="#FFFFFF" stroke="#12A06B" stroke-opacity="0.5"/>
    <text x="972" y="225" text-anchor="middle" fill="#0B3D2C"
          font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="38" font-weight="800">M</text>

    <text x="1128" y="372" text-anchor="end" fill="#5E8A78"
          font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
          font-size="11" letter-spacing="2.2">MĪZĀN · BALANCE BY DESIGN</text>
  </g>

  <g class="fade-in">
    <rect x="72" y="52" width="252" height="30" rx="15" fill="#FFFFFF" stroke="#C08A22" stroke-opacity="0.5"/>
    <circle class="live" cx="92" cy="67" r="4.4" fill="#C08A22"/>
    <text x="106" y="72" fill="#8A6414" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
          font-size="11.5" letter-spacing="2.6">KASUR · PUNJAB · PAKISTAN</text>
  </g>

  <g class="fade-in-2">
    <text x="72" y="172" fill="#0A2B20" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="74" font-weight="800" letter-spacing="-2.6">Muaaz Iqbal</text>
    <g clip-path="url(#nameClip)" opacity="0.28">
      <rect x="40" y="96" width="620" height="96" fill="url(#sweep)"/>
    </g>

    <rect x="74" y="196" width="72" height="3" rx="1.5" fill="#12A06B"/>
    <rect x="152" y="196" width="26" height="3" rx="1.5" fill="#C08A22"/>

    <text x="74" y="234" fill="#4C7566" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="16" font-weight="600" letter-spacing="2.3">FULL-STACK DEVELOPER · AI ORCHESTRATOR</text>
    <text x="74" y="262" fill="#4C7566" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="16" font-weight="600" letter-spacing="2.3">FOUNDER OF MIZANORA · KOTLIN &amp; NEXT.JS</text>

    <text x="74" y="305" fill="#1E4538" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="19" font-weight="500">Software that speaks Urdu first — and still runs</text>
    <text x="74" y="331" fill="#1E4538" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="19" font-weight="500">on a Rs 20,000 phone.</text>
  </g>

  <g>
    <rect x="72" y="352" width="470" height="36" rx="18" fill="#FFFFFF" stroke="#12A06B" stroke-opacity="0.35"/>
    <circle class="live" cx="94" cy="370" r="4.4" fill="#12A06B"/>
    <text x="108" y="375" fill="#0E6B4B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
          font-size="12" letter-spacing="1.4">SHIPPING IN PUBLIC · 90+ REPOSITORIES · SINCE 2025</text>
  </g>

  <line class="draw" x1="72" y1="404" x2="1128" y2="404" stroke="url(#rule)" stroke-width="1.2" stroke-opacity="0.6"/>
</svg>
