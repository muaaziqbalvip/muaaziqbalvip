<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">Muaaz Iqbal — full-stack developer, AI orchestrator, founder of Mizanora</title>
  <desc id="d">Banner for Muaaz Iqbal, Kasur, Punjab, Pakistan, with a live local-time clock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#F2FAF6"/><stop offset="1" stop-color="#E4F5EC"/>
    </linearGradient>
    <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#08241B"/><stop offset="0.72" stop-color="#08241B"/><stop offset="1" stop-color="#0E7A52"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.87" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#12A06B" stop-opacity="0.14"/><stop offset="1" stop-color="#12A06B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.06" cy="1" r="0.6">
      <stop offset="0" stop-color="#B8860B" stop-opacity="0.16"/><stop offset="1" stop-color="#B8860B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12A06B"/><stop offset="0.55" stop-color="#12A06B" stop-opacity="0.22"/><stop offset="1" stop-color="#12A06B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12A06B"/><stop offset="0.5" stop-color="#12A06B" stop-opacity="0.25"/><stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="sweep" x1="-0.3" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.6;1.6" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.1;2.3" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#0E7A52" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1" fill="#12A06B" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="nameClip">
      <text x="66" y="206" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-3">Muaaz Iqbal</text>
    </clipPath>
    <style>
      .r1 { transform-origin: 962px 236px; animation: spin 52s linear infinite; }
      .r2 { transform-origin: 962px 236px; animation: spin 30s linear infinite reverse; }
      .r3 { transform-origin: 962px 236px; animation: breathe 6s ease-in-out infinite; }
      .dotA { transform-origin: 962px 236px; animation: spin 16s linear infinite; }
      .dotB { transform-origin: 962px 236px; animation: spin 24s linear infinite reverse; }
      .live { animation: live 2.4s ease-in-out infinite; }
      .float { animation: floaty 9s ease-in-out infinite; }
      .float2 { animation: floaty 13s ease-in-out 1.4s infinite; }
      .scan { animation: scan 7s linear infinite; }
      .fade1 { animation: fadeIn 1.1s ease-out both; }
      .fade2 { animation: fadeIn 1.1s ease-out .2s both; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes live { 0%,100% { opacity: 1; r: 4.8; } 50% { opacity: .3; r: 3.2; } }
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes scan { 0% { transform: translateX(-200px); } 100% { transform: translateX(1400px); } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

